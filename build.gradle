plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        // Put the Thaumaturge and Vivecraft jars into run/mods to test in game.
        client {
            client()
            // Dumps every class a mixin touched to run/.mixin.out, to check our hooks landed.
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runSelftest: opens the focus picker, saves run/screenshots/visinhand_selftest.png
        // and closes the game by itself.
        selftest {
            client()
            systemProperty 'visinhand.selftest', 'true'
            systemProperty 'mixin.debug.export', 'true'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Vivecraft public API (org.vivecraft.api.*).
    compileOnly "maven.modrinth:vivecraft:${vivecraft_version}"
    // Thaumaturge has no up-to-date public maven. Put its jar into libs/ (local only, never
    // shipped or committed). Mixins target it by name; only the client focus panel calls its API.
    compileOnly fileTree(dir: 'libs', include: 'thaumaturge-*.jar')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            vivecraft_version_range    : vivecraft_version_range,
            thaumaturge_version_range  : thaumaturge_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
