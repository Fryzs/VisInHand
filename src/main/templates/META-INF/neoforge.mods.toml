modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
VR compatibility for Vivecraft players. Each part turns on only when its mod is installed:
- Thaumaturge: wands, foci, the thaumometer and other aimed tools follow the controller; a pointable focus picker replaces the mouse radial.
- Industrial Craft 2: the mining laser fires from the controller; stick movement counts as "forward" for jetpacks and quantum leggings.
- CC: Tweaked: the VR keyboard opens with computer and pocket computer screens.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "thaumaturge"
type = "optional"
versionRange = "${thaumaturge_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ic2"
type = "optional"
versionRange = "[21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "computercraft"
type = "optional"
versionRange = "[1.110,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "vivecraft"
type = "required"
versionRange = "${vivecraft_version_range}"
ordering = "AFTER"
side = "BOTH"
